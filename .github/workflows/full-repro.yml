name: Full Benchmark & Gate Reproduction (Gates 1-8B)

on:
  workflow_dispatch:

jobs:
  full-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Stockfish UCI engine
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run complete topo_chess + topo_brick 64-test verification suite
        env:
          STOCKFISH_PATH: /usr/games/stockfish
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          pytest -v tests/
