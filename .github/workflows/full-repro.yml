name: Full Benchmark & Gate Reproduction (Gates 1-9D)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Stockfish UCI engine
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install SHA-256 locked dependencies and package
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/build-lock.txt
          pip install --require-hashes -r requirements/py313-lock.txt
          pip install --no-deps --no-build-isolation -e .
          python -m pip freeze --all

      - name: Run complete topo_chess + topo_brick 124-test verification suite
        env:
          STOCKFISH_PATH: /usr/games/stockfish
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python -O -m pytest -v tests/test_p13_security_hardening_audit.py tests/test_topo_brick/test_p14_tb_fix_22nov_audit.py
          pytest -v tests/
