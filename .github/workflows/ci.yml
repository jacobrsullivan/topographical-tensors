name: CI

on:
  push:
    branches: [main, public-release]
  pull_request:
    branches: [main, public-release]

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Stockfish UCI engine
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pip freeze --all

      - name: Lint with ruff
        run: |
          ruff check src/ tests/ scripts/

      - name: Verify non-editable wheel build, bundled data assets & isolated venv execution
        run: |
          python -m build --wheel --outdir dist/
          python -c "import zipfile; z = zipfile.ZipFile(next(__import__('pathlib').Path('dist').glob('*.whl'))); assert any('compiled_ldraw_catalog.json.gz' in n for n in z.namelist()); assert any('compiled_mold_retrieval_index.npz' in n for n in z.namelist()); assert any('compiled_landmark_detail_index.json.gz' in n for n in z.namelist()); assert any('set_10698_1_rebrickable_inventory.json' in n for n in z.namelist())"
          python -m venv /tmp/ci_wheel_venv
          /tmp/ci_wheel_venv/bin/pip install dist/*.whl
          (cd /tmp && PYTHONPATH="" /tmp/ci_wheel_venv/bin/python -c "import sys, topo_brick; assert 'torch' not in sys.modules; print(topo_brick.SET_10698_COLORED_INVENTORY.total_pieces())")
          rm -rf /tmp/ci_wheel_venv dist/

      - name: Run Phase 13 security & Phase 15–16.1 architecture hardening audits (standard & python -O)
        env:
          STOCKFISH_PATH: /usr/games/stockfish
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          pytest -v tests/test_p13_security_hardening_audit.py tests/test_topo_brick/test_p15_refactor_equivalence.py tests/test_topo_brick/test_p15_architecture_and_policy_audit.py tests/test_topo_brick/test_p16_v2_assessment_remediation_audit.py tests/test_topo_brick/test_p16_1_closure_audit.py
          python -O -m pytest -v tests/test_p13_security_hardening_audit.py tests/test_topo_brick/test_p15_architecture_and_policy_audit.py tests/test_topo_brick/test_p16_v2_assessment_remediation_audit.py tests/test_topo_brick/test_p16_1_closure_audit.py

      - name: Run topo_chess unit & compliance test suite
        env:
          STOCKFISH_PATH: /usr/games/stockfish
        run: |
          pytest -v tests/test_gate1_encoding_and_hygiene.py tests/test_gate2_ipa_equivariance.py tests/test_gate3_d3pm_legality.py tests/test_phase_d_audit_compliance.py tests/test_phase_e_round2_compliance.py

      - name: Run topo_brick core kernel, catalog, contract/falsification audit & quickstart CI gate
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          pytest -v tests/test_topo_brick/test_p12_contract_and_falsification_audit.py tests/test_topo_brick/test_p14_tb_fix_22nov_audit.py
          pytest -v tests/test_topo_brick/test_wp_l1_interface.py tests/test_topo_brick/test_wp_l2_fields.py tests/test_topo_brick/test_wp_l3_planner_and_equilibrium.py tests/test_topo_brick/test_wp_l4_l5_diffusion_and_benchmarks.py tests/test_topo_brick/test_revised_construction_kernel.py
          pytest -v tests/test_topo_brick/test_p11_gates9a_to_9d_five_extensions.py -k "not gate9"
          python -m topo_brick.evaluation.independent_verifier --self-test
          python scripts/run_topo_brick_quickstart.py

  min-torch-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install exact minimum supported PyTorch floor (2.10.0 CPU)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.10.0"
          pip install -e ".[dev]"
          python -m pip freeze --all

      - name: Verify security floor & core gates under torch==2.10.0
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          pytest -v tests/test_p13_security_hardening_audit.py tests/test_gate1_encoding_and_hygiene.py
