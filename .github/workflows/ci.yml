name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Stockfish UCI engine
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src/ tests/

      - name: Run unit test suite
        env:
          STOCKFISH_PATH: /usr/games/stockfish
        run: |
          pytest -v tests/test_gate1_encoding_and_hygiene.py tests/test_gate2_ipa_equivariance.py tests/test_gate3_d3pm_legality.py tests/test_phase_d_audit_compliance.py tests/test_phase_e_round2_compliance.py
