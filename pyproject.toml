[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topo-chess"
version = "5.0.0"
description = "Geometric Move-Potential Representations, Local-Frame Invariant Point Attention, and Action-Only D3PM Discrete Diffusion for Searchless Chess"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Jacob Sullivan", email = "jacobrsullivan@gmail.com"}
]
dependencies = [
    "torch>=2.4.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "chess>=1.10.0",
    "pyyaml>=6.0.1",
    "zstandard>=0.22.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F"]
